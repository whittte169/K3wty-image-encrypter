<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K3wtyTools — Image Encrypter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="https://whittte169.github.io/K3wtyTools/"><span class="mark" aria-hidden="true"></span>K3wtyTools</a>
    <div class="links">
      <a href="https://github.com/whittte169/K3wty-image-encrypter" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> GitHub</a>
    </div>
  </nav>
  <main class="page">
    <section class="card">
      <p class="label">// utility — aes-256-gcm</p>
      <h1>Image encrypter</h1>
      <p class="lead">Encrypt an image in your browser and keep the key. Nothing is uploaded.</p>
      <div class="tabs">
        <button id="select-encrypt-button" class="tab active" type="button">Encrypter</button>
        <button id="select-decrypt-button" class="tab" type="button">Decrypter</button>
      </div>
      <label for="file-selector" id="file-selector-label" class="drop">
        <input type="file" id="file-selector" accept="image/*" hidden>
        <span id="file-selector-text">Select image</span>
      </label>
      <div id="is-image-selected" class="picked" style="display: none;">
        <img id="selected-image" src="" alt="Preview" hidden>
        <span id="is-image-selected-text">Image is selected!</span>
      </div>
      <div class="field">
        <span id="encrypt-key-text">Your key</span>
        <input type="text" id="decrypt-key-input" placeholder="Enter your key here..." style="display: none;">
        <button id="copy" class="copy" data-state="copy" type="button" aria-label="Copy key"><svg class="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg><svg class="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><svg class="i-bad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="progress-container" class="progress" style="display: none;">
        <div id="progress-bar" class="bar"></div>
      </div>
      <button id="encrypt-button" class="btn" type="button">Encrypt</button>
    </section>
  </main>
  <footer class="foot">
    <span>K3wtyTools © 2026 — Open source.</span>
    <a href="https://github.com/whittte169" target="_blank" rel="noopener">whittte169</a>
  </footer>
  <script src="script.js"></script>
</body>
</html>
